[package]
name = "tokio-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
